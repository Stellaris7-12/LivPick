server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:hmdp}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 20
        batch.size: 32768
        compression.type: lz4
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:livpick-consumer-group}
      enable-auto-commit: false
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.livepick.entity
livpick:
  prefix-distinction-name: ${prefix.distinction.name:livpick}
  kafka:
    seckill-order-topic: seckill-order-create
    seckill-order-dlq-topic: seckill-order-create.DLQ
    seckill-order-group: livpick-seckill-order
    seckill-order-dlq-group: livpick-seckill-order-dlq
    cache-delete-retry-topic: cache-shop-delete-retry
    partitions: 1
    replicas: 1
    outbox-scan-interval-ms: 3000
    outbox-max-attempts: 5
    outbox-initial-backoff-ms: 500
    outbox-max-backoff-ms: 10000
  order:
    timeout-minutes: 15
    timeout-scan-interval-ms: 60000
    timeout-scan-batch-size: 100
    delay-queue-name: order:timeout:queue
  cache:
    delete-retry-max-attempts: 3
    delete-retry-initial-delay-ms: 5000
    delete-retry-max-delay-ms: 60000
    delete-retry-scan-interval-ms: 5000
    delete-retry-message-ttl-minutes: 60
    delete-retry-batch-size: 20
  bloom:
    shop-filter-name: bf:shop:id
    expected-insertions: 100000
    false-probability: 0.03
  benchmark:
    enabled: ${LIVPICK_BENCHMARK_ENABLED:false}
    skip-login-check: ${LIVPICK_BENCHMARK_SKIP_LOGIN_CHECK:false}
  redis-rollback:
    max-attempts: 3
    initial-backoff-ms: 200
    max-backoff-ms: 1000
  reconcile:
    scan-interval-ms: 15000
    grace-period-ms: 15000
    trace-fallback-ttl-seconds: 86400
logging:
  level:
    com.livepick: info
  pattern:
    dateformat: mm:ss.SSS
